<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ app_name }} — Kanban</title>
  <style>
    :root { --bg:#101820; --card:#1c2836; --text:#eef3f8; --muted:#9aabbf; --accent:#2f9e7a; --ok:#5ddea0; --err:#e07a7a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; background:linear-gradient(160deg,#0c1218,#15202b 50%,#101820); color:var(--text); min-height:100vh; }
    header { display:flex; justify-content:space-between; align-items:center; padding:1rem 1.25rem; border-bottom:1px solid #2a3a4d; flex-wrap:wrap; gap:.75rem; }
    header a { color:var(--accent); }
    .actions { display:flex; gap:.75rem; align-items:center; flex-wrap:wrap; }
    .actions button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:.45rem .85rem; font-weight:600; cursor:pointer; }
    .actions button:disabled { opacity:.6; cursor:wait; }
    .banner { margin:0 1rem; padding:.65rem 1rem; border-radius:8px; display:none; }
    .banner.err { display:block; background:#3a1f24; border:1px solid #6b3038; color:var(--err); }
    .banner.info { display:block; background:#1e3d32; border:1px solid #2f5c4a; color:var(--ok); }
    .loading { padding:0 1.25rem; color:var(--muted); font-size:.9rem; }
    .cols { display:grid; grid-template-columns: repeat(5, 1fr); gap:1rem; padding:1rem; min-height:70vh; }
    @media (max-width:1100px){ .cols { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width:600px){ .cols { grid-template-columns:1fr; } }
    .col { background:var(--card); border-radius:12px; padding:.75rem; border:1px solid #2a3a4d; }
    .col h2 { margin:.25rem 0 .75rem; font-size:1rem; color:var(--muted); font-weight:600; }
    .card { background:#121a24; border:1px solid #314457; border-radius:10px; padding:.75rem; margin-bottom:.6rem; }
    .card strong { display:block; margin-bottom:.25rem; }
    .meta { font-size:.8rem; color:var(--muted); }
    select { margin-top:.5rem; background:#243044; color:#fff; border:0; border-radius:8px; padding:.35rem .6rem; }
    #wa { padding:1rem 1.25rem; border-top:1px solid #2a3a4d; }
    #wa pre { background:#121a24; padding:.75rem; border-radius:8px; overflow:auto; max-height:180px; font-size:.75rem; }
    .badge { font-size:.7rem; background:#1e3d32; padding:.15rem .45rem; border-radius:999px; color:var(--ok); }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>{{ app_name }}</strong>
      <span class="badge">{{ arm }}</span>
    </div>
    <div class="actions">
      <button type="button" id="btn-reminders">Enviar recordatorios debidos</button>
      <a href="/book" target="_blank">Link de agendamiento</a>
      · Basic auth (.env)
    </div>
  </header>
  <div id="banner" class="banner" role="alert"></div>
  <p id="loading" class="loading" aria-live="polite">Cargando citas…</p>
  <div class="cols">
    <div class="col" id="col-new_lead"><h2>Nuevo lead</h2></div>
    <div class="col" id="col-confirmed"><h2>Cita confirmada</h2></div>
    <div class="col" id="col-completed"><h2>Completado</h2></div>
    <div class="col" id="col-cancelled"><h2>Cancelado</h2></div>
    <div class="col" id="col-no_show"><h2>No show</h2></div>
  </div>
  <section id="wa">
    <h2>WhatsApp mock</h2>
    <pre id="wa-log">cargando…</pre>
  </section>
  <script>
    const cols = ["new_lead", "confirmed", "completed", "cancelled", "no_show"];
    const opts = { credentials: "same-origin" };
    const banner = document.getElementById("banner");
    const loadingEl = document.getElementById("loading");

    function showBanner(text, kind) {
      banner.textContent = text;
      banner.className = "banner " + (kind || "err");
    }
    function clearBanner() {
      banner.textContent = "";
      banner.className = "banner";
    }

    async function load() {
      loadingEl.hidden = false;
      loadingEl.textContent = "Cargando citas…";
      try {
        const res = await fetch("/api/appointments", opts);
        if (!res.ok) {
          showBanner("Auth Basic requerida o error al cargar citas (" + res.status + ").", "err");
          loadingEl.textContent = "Error al cargar.";
          return;
        }
        clearBanner();
        const data = await res.json();
        cols.forEach(c => {
          const el = document.getElementById("col-" + c);
          const title = el.querySelector("h2").textContent;
          el.innerHTML = `<h2>${title}</h2>`;
        });
        for (const a of data) {
          const div = document.createElement("div");
          div.className = "card";
          div.innerHTML = `<strong>${a.customer_name}</strong>
            <div class="meta">${a.service_name || ""} · ${a.phone}</div>
            <div class="meta">${new Date(a.starts_at).toLocaleString()}</div>
            <select>
              ${cols.map(s =>
                `<option value="${s}" ${s===a.status?"selected":""}>${s}</option>`).join("")}
            </select>`;
          div.querySelector("select").onchange = async (e) => {
            await fetch("/api/appointments/" + a.id, {
              method: "PATCH",
              headers: {"Content-Type": "application/json"},
              credentials: "same-origin",
              body: JSON.stringify({status: e.target.value})
            });
            load(); loadWa();
          };
          const col = cols.includes(a.status) ? a.status : "new_lead";
          document.getElementById("col-" + col).appendChild(div);
        }
        loadingEl.hidden = true;
      } catch (err) {
        showBanner("No se pudieron cargar las citas.", "err");
        loadingEl.textContent = "Error de red.";
      }
    }

    async function loadWa() {
      const res = await fetch("/api/wa/messages", opts);
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById("wa-log").textContent = data.map(m =>
        `[${m.template}] → ${m.to_phone}: ${m.body}`).join("\n\n") || "(vacío)";
    }

    document.getElementById("btn-reminders").onclick = async () => {
      const btn = document.getElementById("btn-reminders");
      btn.disabled = true;
      btn.textContent = "Enviando…";
      try {
        const res = await fetch("/api/wa/dispatch-reminders", {
          method: "POST",
          credentials: "same-origin",
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showBanner(data.detail?.error || data.error || "Error al enviar recordatorios", "err");
        } else {
          showBanner(`Recordatorios enviados: ${data.count || 0}`, "info");
          loadWa();
        }
      } catch (e) {
        showBanner("Error de red al enviar recordatorios.", "err");
      } finally {
        btn.disabled = false;
        btn.textContent = "Enviar recordatorios debidos";
      }
    };

    load(); loadWa();
    setInterval(() => { load(); loadWa(); }, 8000);
  </script>
</body>
</html>
