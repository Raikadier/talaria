<h1>Quickstart</h1>
<ol>
<li>Clona el repo / abre el vault.</li>
<li><code>pip install -e .</code></li>
<li><code>python -m skillgraph_cli verify boot --json</code></li>
<li>MCP <code>skillgraph</code> + <code>obsidian</code></li>
<li><code>forge run</code> → Act → <code>forge check</code> → scorecard → <code>verify close</code></li>
</ol>
<pre>python -m skillgraph_cli doctor --json
python -m skillgraph_cli mode set strict</pre>
