[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talaria"
version = "1.1.0"
description = "Talaria — cognitive operating suit (SPINE + AXON + FORGE) for any AI agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David" }]
keywords = ["agent", "mcp", "obsidian", "spine", "second-brain", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.optional-dependencies]
tools = [
  "markitdown[all]",
  "graphifyy[pdf,office,mcp]",
]
dev = [
  "pytest>=7.0",
]

[project.scripts]
talaria = "talaria_cli.cli:main"

[project.urls]
Homepage = "https://github.com/Raikadier/talaria"
Repository = "https://github.com/Raikadier/talaria"

[tool.setuptools.packages.find]
where = ["src"]
include = ["talaria_cli*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
