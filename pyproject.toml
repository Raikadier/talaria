[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "talaria"
version = "1.0.0"
description = "Talaria CLI - Cognitive Operating System (TCOS) / SPINE orchestration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David" }]
dependencies = []

[project.scripts]
talaria = "talaria_cli.cli:main"

[tool.setuptools.packages.find]
include = ["talaria_cli*"]
